# Factory-X Consumer Gateway (OpenResty + RFC 8693 token exchange)
#
# Based on the reference consumer gateway from the Factory-X
# "mxport-leo-gateway" project (openresty-sts-module). Adapted for a
# Mnestix proof-of-concept:
#   - the strict provider allowlist is relaxed (any host is permitted),
#   - the STS endpoint and provider scheme are configurable via env vars.
#
# Incoming requests follow the convention:
#   /external/<provider_host>/<provider_path>
# The gateway exchanges the caller's bearer token for a provider-scoped
# token via the Consumer STS, then proxies the request to the provider.

worker_processes 1;
events { worker_connections 1024; }

# Make selected environment variables available to Lua via os.getenv.
env STS_URL;
env PROVIDER_SCHEME;

http {
  error_log /usr/local/openresty/nginx/logs/error.log info;

  # Shared cache for exchanged tokens (10 MB)
  lua_shared_dict sts_token_cache 10m;

  # Set TLS certificates
  lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  lua_ssl_verify_depth 3;

  # DNS resolver; required for dynamic proxy_pass
  resolver 8.8.8.8 valid=30s ipv6=off;

  init_by_lua_block {
    -- PoC: allowlist relaxed. In production, populate this table from the
    -- infrastructure database and reject any host not present.
    sts_url        = os.getenv("STS_URL") or "http://factory-x-sts:8080/sts/token"
    provider_scheme = os.getenv("PROVIDER_SCHEME") or "https"
  }

  server {
    listen 80;
    server_name gateway.consumer;
    location = /healthz { return 200 "OK\n"; }

    location ~ ^/external/(?<provider_host>[^/]+)(?<provider_path>/.*)$ {
      access_by_lua_block {
        local host = ngx.var.provider_host

        -- PoC: no allowlist enforcement, only log the outbound target.
        ngx.log(ngx.INFO, "proxying to provider: ", host)

        -- Mint the provider-scoped token for the validated host.
        require("sts").exchange({
          sts_url        = sts_url,
          target_service = host,
        })
      }

      set_by_lua_block $provider_scheme { return provider_scheme }
      proxy_set_header Host $provider_host;
      proxy_pass $provider_scheme://$provider_host$provider_path;
    }
  }
}
