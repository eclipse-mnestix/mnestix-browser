services:
  keycloak:
    image: keycloak/keycloak:26.6.3
    container_name: keycloak
    volumes:
      - ./docker-compose/data/keycloak/realm/Mnestix-realm.json:/opt/keycloak/data/import/realm-config.json
    ports:
      - 8080:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # hostname v2: the browser uses this URL directly, so it stays localhost (no /etc/hosts entry needed).
      # backchannel-dynamic lets in-network services resolve the token/JWKS endpoints at their own host (keycloak:8080).
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HEALTH_ENABLED: 'true'
    command: ['start-dev', '--import-realm']
    healthcheck: # check the management port for a valid response (service ready)
      test: #keycloak has no curl in image; health moved to the 9000 management port in KC 25+
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 30s
      timeout: 10s
      retries: 6
    networks:
      - mnestix-network

  aas-environment:
    environment:
      # Authorization basic
      basyx.feature.authorization.enabled: 'true'
      basyx.feature.authorization.type: rbac
      basyx.feature.authorization.jwtBearerTokenProvider: keycloak
      basyx.feature.authorization.rbac.file: file:/data/rbac_rules.json
      # token issuer is the front-channel host (localhost); keys are fetched from the in-network host (keycloak)
      spring.security.oauth2.resourceserver.jwt.issuer-uri: 'http://localhost:8080/realms/Mnestix'
      spring.security.oauth2.resourceserver.jwt.jwk-set-uri: 'http://keycloak:8080/realms/Mnestix/protocol/openid-connect/certs'
    volumes:
      - ./docker-compose/data/keycloak/rbac_rules.json:/data/rbac_rules.json:ro

  mnestix-browser:
    environment:
      AUTHENTICATION_FEATURE_FLAG: 'true'
      NEXTAUTH_URL: 'http://localhost:3000'
      KEYCLOAK_ENABLED: 'true'
      KEYCLOAK_CLIENT_ID: 'mnestix-browser-client-demo'
      # server-side calls (discovery/token/userinfo) use the in-network host; the browser redirect uses localhost
      KEYCLOAK_ISSUER: 'http://keycloak:8080'
      KEYCLOAK_LOCAL_URL: 'http://localhost:8080'
      KEYCLOAK_REALM: 'Mnestix'

  mnestix-proxy:
    environment:
      # OpenID Configuration
      OpenId__EnableOpenIdAuth: 'true'
      OpenId__Issuer: 'http://keycloak:8080/realms/Mnestix'
      OpenId__ClientID: 'mnestixApi-demo'
      OpenId__RequireHttpsMetadata: 'false'

  mnestix-aas-generator:
    environment:
      Features__UseAuthentication: 'true'
      # OpenId repository settings
      RepositoryOpenIdConnect__EnableRepositoryOpenIdAuth: 'true'
      RepositoryOpenIdConnect__Authority: 'http://keycloak:8080/realms/Mnestix'
      RepositoryOpenIdConnect__DiscoveryEndpoint: '.well-known/openid-configuration'
      RepositoryOpenIdConnect__ClientId: 'mnestix-repo-client-demo'
      RepositoryOpenIdConnect__ClientSecret: ${REPOSITORY_API_CLIENT_SECRET:-WLOB68nSllHTlr7ViUOZWWxildWFT2nN}
      RepositoryOpenIdConnect__ValidateIssuer: 'false'
      RepositoryOpenIdConnect__TokenEndpoint: 'http://keycloak:8080/realms/Mnestix/protocol/openid-connect/token'
      # OpenID Configuration
      OpenId__EnableOpenIdAuth: 'true'
      OpenId__Issuer: 'http://keycloak:8080/realms/Mnestix'
      OpenId__ClientID: 'mnestixApi-demo'
      OpenId__RequireHttpsMetadata: 'false'
    depends_on:
      keycloak:
        condition: service_healthy
