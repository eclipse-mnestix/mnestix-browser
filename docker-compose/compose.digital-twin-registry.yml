services:
  # This override keeps the BaSyx *Java* Digital Twin Registry stack. It ships its own
  # MongoDB instance so it stays self-contained and independent of the BaSyx Go environment
  # used by the main compose.yml.
  # See https://github.com/eclipse-mnestix/mnestix-browser/issues/498
  mongodb:
    image: mongo:8
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoAdmin
      MONGO_INITDB_ROOT_PASSWORD: mongoPassword
    healthcheck:
      test: echo "db.runCommand(\"ping\").ok" | mongosh mongodb:27017/test --quiet
      interval: 3s
      timeout: 3s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-file: '5'
        max-size: '100m'
    networks:
      - mnestix-network
    volumes:
      - mnestix-mongodb-data:/data/db

  aas-digital-twin-registry:
    image: eclipsebasyx/digitaltwinregistry:2.0.0-SNAPSHOT
    ports:
      - '8085:8081'
    depends_on:
      - mongodb
    environment:
      BASYX__BACKEND: MongoDB
      BASYX_CORS_ALLOWED-METHODS: GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD
      BASYX_CORS_ALLOWED-ORIGINS: '*'
      REGISTRY__DISCOVERY__ENABLED: 'true'
      # Using URI to strictly enforce authentication against 'admin' db while using 'basyxdb' for data
      SPRING_DATA_MONGODB_URI: 'mongodb://mongoAdmin:mongoPassword@mongodb:27017/basyxdb?authSource=admin'
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 100000KB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 100000KB
    healthcheck: # check the endpoint for a valid response (service ready)
      test: curl -f http://localhost:8081/actuator/health
      interval: 30s
      timeout: 10s
      retries: 6
    logging:
      driver: 'json-file'
      options:
        max-file: '5'
        max-size: '100m'
    networks:
      - mnestix-network

  mnestix-browser:
    environment:
      REGISTRY_API_URL: 'http://aas-digital-twin-registry:8081/'
      # We do not need to adjust the Discovery URL as it already points to the Proxy which routes to the Digital Twin Registry

  mnestix-proxy:
    environment:
      ReverseProxy__Clusters__discoveryCluster__Destinations__destination1__Address: 'http://aas-digital-twin-registry:8081/'

  # The browser and proxy above are rerouted to the BaSyx Java Digital Twin Registry, so the
  # registry/discovery endpoints integrated into the BaSyx Go aas-environment are simply left unused.

volumes:
  mnestix-mongodb-data:
