networks:
  mnestix-network:
    driver: bridge
    name: mnestix-network

volumes:
  mnestix-database:
  basyx-db-data:

services:
  mnestix-browser:
    container_name: mnestix-browser
    image: mnestix/mnestix-browser:latest
    build:
      dockerfile: ../Dockerfile
      target: production
    ports:
      - '3000:3000'
    environment:
      # The unified BaSyx Go environment serves repositories, registries and discovery on a single port.
      REGISTRY_API_URL: 'http://aas-environment:8081'
      SUBMODEL_REGISTRY_API_URL: 'http://aas-environment:8081'
      DISCOVERY_API_URL: 'http://aas-environment:8081'
      AAS_REPO_API_URL: 'http://aas-environment:8081'
      SUBMODEL_REPO_API_URL: 'http://aas-environment:8081'
      CONCEPT_DESCRIPTION_REPO_API_URL: 'http://aas-environment:8081'
      SERIALIZATION_API_URL: 'http://aas-environment:8081'
      AAS_LIST_FEATURE_FLAG: 'true'
      MNESTIX_AAS_GENERATOR_API_URL: ''
      AUTHENTICATION_FEATURE_FLAG: 'false'
      LOCK_TIMESERIES_PERIOD_FEATURE_FLAG: 'true'
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-verySecureNextAuthSecret}
      IMPRINT_URL: ''
      DATA_PRIVACY_URL: ''
      BASYX_RBAC_ENABLED: 'false'
      SECRET_ENC_KEY: ${SECRET_ENC_KEY:-J+mMxwKo+aoFJ6uxMv6Acv54buuBir2EJ3z6LGFB+Vo=} # needs to be secure, can be generated by: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
    depends_on:
      aas-environment:
        condition: service_healthy # only after the healthcheck in aas is successful, the mnestix container is being created
    networks:
      - mnestix-network
    volumes:
      - mnestix-database:/app/prisma/database

  basyx-db:
    image: postgres:16-alpine
    container_name: basyx-db
    environment:
      - POSTGRES_USER=basyx
      - POSTGRES_PASSWORD=basyx
      - POSTGRES_DB=basyxdb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U basyx -d basyxdb']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - basyx-db-data:/var/lib/postgresql/data
    logging:
      driver: 'json-file'
      options:
        max-file: '5'
        max-size: '100m'
    networks:
      - mnestix-network

  # One-shot service that initializes the PostgreSQL schema before the environment starts.
  basyx-configuration:
    image: eclipsebasyx/basyxconfigurationservice-go:1.0.2
    container_name: basyx-configuration
    environment:
      - POSTGRES_HOST=basyx-db
      - POSTGRES_PORT=5432
      - POSTGRES_DBNAME=basyxdb
      - POSTGRES_USER=basyx
      - POSTGRES_PASSWORD=basyx
    depends_on:
      basyx-db:
        condition: service_healthy
    networks:
      - mnestix-network

  # Unified BaSyx Go environment: serves the AAS repository, Submodel repository,
  # Concept Description repository, AAS/Submodel registries and Discovery from a single service.
  aas-environment:
    image: eclipsebasyx/aasenvironment-go:1.0.2
    container_name: aas-environment
    command: ['/app/aasenvironmentservice']
    ports:
      - '8081:8081'
    environment:
      - SERVER_PORT=8081
      - POSTGRES_HOST=basyx-db
      - POSTGRES_PORT=5432
      - POSTGRES_DBNAME=basyxdb
      - POSTGRES_USER=basyx
      - POSTGRES_PASSWORD=basyx
      - CORS_ALLOWEDORIGINS=*
      - CORS_ALLOWEDMETHODS=GET,POST,PUT,PATCH,DELETE,OPTIONS
      - CORS_ALLOWEDHEADERS=*
      - CORS_ALLOWEDCREDENTIALS=true
      - ABAC_ENABLED=false
      - GENERAL_AASREGISTRYINTEGRATION=true
      - GENERAL_DISCOVERYINTEGRATION=true
      - GENERAL_SUBMODELREGISTRYINTEGRATION=true
      - GENERAL_EXTERNALURL=http://aas-environment:8081
    depends_on:
      basyx-configuration:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', '/bin/healthprobe']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-file: '5'
        max-size: '100m'
    networks:
      - mnestix-network
